function teacherView(){applyTheme(); const g=state.game; app.innerHTML=header()+`<main class="main"><div class="section-head"><div><h3>${t('tabTeacher')}</h3><p>${t('teacherTips')}</p></div><div class="row"><button class="ghost small" onclick="go('home')">← Home</button><button class="btn small" onclick="exportWorkbook()">📊 ${t('saveExcel')}</button><button class="ghost small" onclick="loadDemo()">🔄 ${t('importExample')}</button></div></div><div class="tabs"><button class="active">${t('tabTeacher')}</button><button onclick="go('join')">${t('tabStudent')}</button><button onclick="go('results')">${t('tabResults')}</button></div><div class="layout"><div class="stack"><div class="panel"><h4>⚙️ ${t('gameSettings')}</h4><div class="grid2"><div class="field"><label>${t('nameGame')}</label><input id="gameName" class="input" value="${esc(g.name)}"></div><div class="field"><label>${t('topic')}</label><input id="gameTopic" class="input" value="${esc(g.topic)}"></div></div><div class="grid2"><div class="field"><label>${t('subjects')}</label><select id="gameSubject" class="input">${Object.keys(subjects).map(k=>`<option value="${k}" ${g.subject===k?'selected':''}>${subjectName(k)}</option>`).join('')}</select></div><div class="field"><label>${t('mode')}</label><input class="input" value="${t('single')}" readonly></div></div>${subjectScene(g.subject)}</div><div class="panel"><div class="row between"><h4>🧠 ${t('qBank')}</h4><span class="tag">${g.questions.length} ${t('levels').toLowerCase()} / ${t('typesBlock').toLowerCase()}</span></div><div class="grid3"><div class="field"><label>${t('type')}</label><select id="qType" class="input" onchange="toggleBuilders()"><option value="choice">${t('choice')}</option><option value="tf">${t('tf')}</option><option value="short">${t('short')}</option><option value="open">${t('open')}</option><option value="matching">${t('matching')}</option></select></div><div class="field"><label>${t('level')}</label><select id="qLevel" class="input"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div><div class="field"><label>${t('points')}</label><input id="qPoints" class="input" type="number" min="1" max="10" value="2"></div></div><div class="field"><label>${t('criteria')}</label><input id="qCriterion" class="input" placeholder="${state.lang==='ru'?'Например: Анализ информации':'Мысалы: Ақпаратты талдау'}"></div><div class="field"><label>${t('qText')}</label><textarea id="qText" class="input"></textarea></div>
<div class="field"><label>🖼️ ${t('imageLabel')}</label><input class="input" id="qImage" type="file" accept="image/png,image/jpeg,image/webp" onchange="readQuestionImage(event)"><small class="mini">${t('imageHelp')}</small><div id="imagePreviewArea"></div></div><div id="choiceBox"><div class="field"><label>${t('options')}</label><textarea id="qOptions" class="input" placeholder="A\nB\nC\nD"></textarea></div><div class="field"><label>${t('correct')}</label><input id="qAnswer" class="input"></div></div><div id="tfBox" class="hidden"><div class="field"><label>${t('correct')}</label><select id="qTrueFalse" class="input"><option>${state.lang==='ru'?'Правда':'Дұрыс'}</option><option>${state.lang==='ru'?'Ложь':'Бұрыс'}</option></select></div></div><div id="shortBox" class="hidden"><div class="field"><label>${t('correct')}</label><input id="qShortAnswer" class="input" placeholder="v=s/t"></div></div><div id="openBox" class="hidden"><div class="note">${t('rights')}</div></div><div id="matchBox" class="hidden"><div class="field"><label>${t('pairs')}</label><textarea id="qPairs" class="input" placeholder="Сила = Ньютон\nМасса = Килограмм"></textarea></div></div><div class="row"><button class="btn" onclick="saveQuestion()" id="saveBtn">➕ ${t('addQuestion')}</button><button class="btn secondary" onclick="clearBuilder()">${t('resetDemo')}</button></div><div class="note" style="margin-top:14px">${t('teacherTips')}</div></div><div class="panel"><div class="row between"><h4>📚 ${t('importExample')}</h4><button class="ghost small" onclick="clearAllQuestions()">🗑 ${t('remove')}</button></div>${g.questions.length?g.questions.map((q,i)=>questionPreview(q,i)).join(''):`<div class="empty">${t('noQuestions')}</div>`}</div></div><aside class="stack"><div class="panel hero-image-card"><h4>🌈 ${t('themeNow')}</h4>${subjectScene(g.subject)}<p class="mini" style="margin-top:12px">${t('feature2t')}</p></div><div class="panel"><h4>📋 ${t('typesBlock')}</h4><div class="row"><span class="pill">${t('choice')}</span><span class="pill">${t('tf')}</span><span class="pill">${t('short')}</span><span class="pill">${t('open')}</span><span class="pill">${t('matching')}</span></div><div class="note" style="margin-top:14px">${t('rights')}</div></div></aside></div></main><div class="footer">BILIM QUEST · Teacher Builder</div>`; $('#gameSubject').addEventListener('change',e=>{state.game.subject=e.target.value; state.subject=e.target.value; syncGameMeta(); render()});}
function questionPreview(q,i){return `<div class="question-card"><div class="row between"><div class="question-meta"><span class="pill">${typeLabel(q.type)}</span><span class="pill">LVL ${q.level}</span><span class="pill">${q.points} PT</span></div><div class="row"><button class="ghost small" onclick="editQuestion(${i})">✏️ ${t('edit')}</button><button class="ghost small" onclick="removeQuestion(${i})">🗑 ${t('remove')}</button></div></div><h5>${esc(q.text)}</h5>${q.image?`<img src="${q.image}" alt="${t('imageLabel')}" class="question-photo">`:''}<div class="mini">🎯 ${esc(q.criterion||'—')}</div></div>`}
function typeLabel(type){return ({choice:t('choice'),tf:t('tf'),short:t('short'),open:t('open'),matching:t('matching')})[type]||type}
function syncGameMeta(){state.game.name=$('#gameName')?$('#gameName').value:state.game.name; state.game.topic=$('#gameTopic')?$('#gameTopic').value:state.game.topic; saveGame()}
function clearAllQuestions(){if(confirm('OK?')){state.game.questions=[]; saveGame(); render()}}
function toggleBuilders(){const type=$('#qType').value; ['choice','tf','short','open','matching'].forEach(n=>$('#'+n+'Box').classList.add('hidden')); if(type==='choice')$('#choiceBox').classList.remove('hidden'); if(type==='tf')$('#tfBox').classList.remove('hidden'); if(type==='short')$('#shortBox').classList.remove('hidden'); if(type==='open')$('#openBox').classList.remove('hidden'); if(type==='matching')$('#matchBox').classList.remove('hidden')}
function clearBuilder(){state.editing=-1;tempQuestionImage=''; ['qText','qCriterion','qOptions','qAnswer','qPairs','qShortAnswer'].forEach(id=>{if($('#'+id))$('#'+id).value=''}) ; if($('#qImage'))$('#qImage').value='';showImagePreview(); if($('#qType'))$('#qType').value='choice'; if($('#qLevel'))$('#qLevel').value='1'; if($('#qPoints'))$('#qPoints').value='2'; toggleBuilders(); if($('#saveBtn'))$('#saveBtn').textContent='➕ '+t('addQuestion')}
function editQuestion(i){const q=state.game.questions[i]; state.editing=i; $('#qType').value=q.type; $('#qLevel').value=q.level; $('#qPoints').value=q.points; $('#qCriterion').value=q.criterion||''; $('#qText').value=q.text; tempQuestionImage=q.image||'';showImagePreview(); toggleBuilders(); if(q.type==='choice'){ $('#qOptions').value=q.options.join('\n'); $('#qAnswer').value=q.answer;} if(q.type==='tf'){ $('#qTrueFalse').value=q.answer;} if(q.type==='short'){ $('#qShortAnswer').value=q.answer;} if(q.type==='matching'){ $('#qPairs').value=q.pairs.map(x=>x.join(' = ')).join('\n')} $('#saveBtn').textContent='💾 '+t('updateQuestion'); window.scrollTo({top:360,behavior:'smooth'})}
function removeQuestion(i){state.game.questions.splice(i,1); saveGame(); render()}
function saveQuestion(){syncGameMeta();const type=$('#qType').value; const base={text:$('#qText').value.trim(),type,level:+$('#qLevel').value,points:+$('#qPoints').value,criterion:$('#qCriterion').value.trim()}; if((!base.text&&!tempQuestionImage)||!base.points){toast(t('fillFields'));return} if(!base.text)base.text=state.lang==='kz'?'Сурет бойынша тапсырманы орында':'Выполните задание по изображению'; let q={...base,image:tempQuestionImage||''}; if(type==='choice'){let opts=$('#qOptions').value.split(/\n+/).map(x=>x.trim()).filter(Boolean); let ans=$('#qAnswer').value.trim(); if(opts.length<2||!ans){toast(t('fillFields'));return} q.options=opts;q.answer=ans;} if(type==='tf'){q.options=[state.lang==='ru'?'Правда':'Дұрыс',state.lang==='ru'?'Ложь':'Бұрыс'];q.answer=$('#qTrueFalse').value;} if(type==='short'){const ans=$('#qShortAnswer').value.trim(); if(!ans){toast(t('fillFields'));return} q.answer=ans;} if(type==='open'){q.answer='';} if(type==='matching'){let pairs=$('#qPairs').value.split(/\n+/).map(line=>line.split('=').map(x=>x.trim())).filter(p=>p.length===2&&p[0]&&p[1]); if(pairs.length<2){toast(t('fillFields'));return} q.pairs=pairs;} if(state.editing<0)state.game.questions.push(q); else state.game.questions[state.editing]=q; state.game.questions.sort((a,b)=>a.level-b.level); state.editing=-1; saveGame(); clearBuilder(); render(); toast(t('taskAdded'))}
function joinView(){applyTheme();const g=state.game; app.innerHTML=header()+`<main class="main"><div class="section-head"><div><h3>${t('joinQuest')}</h3><p>${t('roomHint')}</p></div><div class="tag">${subjectName(g.subject)} · ${esc(g.topic)}</div></div><div class="layout"><div class="stack"><div class="panel"><h4>🎯 ${esc(g.name)}</h4><p class="muted">${esc(g.topic)}</p><div class="grid2"><div class="field"><label>${t('studentName')}</label><input id="studentName" class="input" maxlength="40" placeholder="Aruzhan"></div><div class="field"><label>${t('mode')}</label><input class="input" value="${t('single')}" readonly></div></div><div class="field"><label>${t('chooseAvatar')}</label><div class="avatars">${avatars.map(a=>`<button class="${state.avatar===a?'active':''}" onclick="pickAvatar('${a}')">${a}</button>`).join('')}</div></div><button class="btn" onclick="startQuest()">🚀 ${t('begin')}</button></div><div class="panel">${subjectScene(g.subject)}</div></div><aside class="stack"><div class="panel"><h4>🧾 ${t('typesBlock')}</h4><div class="row">${[...new Set(g.questions.map(x=>typeLabel(x.type)))].map(x=>`<span class="pill">${x}</span>`).join('')}</div><div class="note" style="margin-top:12px">${t('rights')}</div></div></aside></div></main>`}
function pickAvatar(a){state.avatar=a; render()}
function startQuest(){const name=$('#studentName').value.trim(); if(!name){toast(t('fillFields')); return} if(!state.game.questions.length){toast(t('noQuestions')); return} state.studentName=name; state.currentIndex=0; state.answers=[]; state.selected=null; go('play')}
function levelsMarkup(){const lvls=[...new Set(state.game.questions.map(x=>x.level))]; const current=state.game.questions[state.currentIndex]?.level; return `<div class="level-strip">${lvls.map(l=>`<span class="level ${l===current?'active':''}">🌍 LVL ${l}</span>`).join('')}</div>`}
function normalize(s){return String(s).trim().toLowerCase().replace(/\s+/g,'')}
function playView(){applyTheme(); const g=state.game; const q=g.questions[state.currentIndex]; if(!q){go('reflect'); return} const progress=((state.currentIndex)/g.questions.length)*100; app.innerHTML=header()+`<main class="main"><div class="section-head"><div><h3>${subjectName(g.subject)} · ${t('play')}</h3><p>${esc(g.name)} · ${esc(state.studentName)} ${state.avatar}</p></div><div class="tag">${state.currentIndex+1} / ${g.questions.length}</div></div><div class="panel">${levelsMarkup()}<div class="progress"><span style="width:${progress}%"></span></div><div class="question-card" style="margin-top:18px"><div class="row between"><div class="question-meta"><span class="pill">${typeLabel(q.type)}</span><span class="pill">LVL ${q.level}</span><span class="pill">⭐ ${q.points}</span></div><span class="pill">🎯 ${esc(q.criterion)}</span></div><h5 style="font-size:24px">${esc(q.text)}</h5>${q.image?`<img src="${q.image}" alt="${t('imageLabel')}" class="question-photo">`:''}${renderQuestionInput(q)}<div id="feedback"></div><div class="row" style="margin-top:16px"><button class="btn" id="submitBtn" onclick="submitAnswer()">${t('submit')}</button><button class="btn secondary hidden" id="nextBtn" onclick="nextQuestion()">${state.currentIndex===g.questions.length-1?t('finish'):t('next')}</button></div></div></div></main>`}
function renderQuestionInput(q){if(q.type==='choice'||q.type==='tf'){return `<div class="choice-grid">${q.options.map((o,i)=>`<button class="choice-btn" data-choice="${i}" onclick="pickChoice(${i})"><strong>${String.fromCharCode(65+i)}.</strong> ${esc(o)}</button>`).join('')}</div>`} if(q.type==='short'){return `<div class="field"><input id="shortAnswer" class="input" placeholder="${t('answer')}"></div>`} if(q.type==='open'){return `<div class="field"><textarea id="openAnswer" class="input" placeholder="${t('answer')}"></textarea></div>`} if(q.type==='matching'){return `<div class="match-grid">${q.pairs.map((p,idx)=>`<div><div class="pill">${esc(p[0])}</div></div><div><input class="input match-input" data-idx="${idx}" placeholder="${t('answer')}"></div>`).join('')}</div>`} return ''}
function pickChoice(i){state.selected=i; $$('[data-choice]').forEach((el,idx)=>el.classList.toggle('selected',idx===i))}
function submitAnswer(){const q=state.game.questions[state.currentIndex]; let userAnswer='', score=null; if(q.type==='choice'||q.type==='tf'){if(state.selected===null){toast(t('chooseAns')); return} userAnswer=q.options[state.selected]; score=normalize(userAnswer)===normalize(q.answer)?q.points:0; $$('[data-choice]').forEach(btn=>btn.disabled=true); } if(q.type==='short'){userAnswer=$('#shortAnswer').value.trim(); if(!userAnswer){toast(t('chooseAns'));return} score=normalize(userAnswer)===normalize(q.answer)?q.points:0; $('#shortAnswer').readOnly=true;} if(q.type==='open'){userAnswer=$('#openAnswer').value.trim(); if(!userAnswer){toast(t('chooseAns'));return} score=null; $('#openAnswer').readOnly=true;} if(q.type==='matching'){const vals=$$('.match-input').map(i=>i.value.trim()); if(vals.some(v=>!v)){toast(t('chooseAns')); return} userAnswer=vals.join(' | '); let correct=0; q.pairs.forEach((p,idx)=>{if(normalize(vals[idx])===normalize(p[1]))correct++}); score=Math.round((correct/q.pairs.length)*q.points*10)/10; $$('.match-input').forEach(i=>i.readOnly=true);} state.answers.push({text:q.text,type:q.type,level:q.level,criterion:q.criterion,points:q.points,answer:userAnswer,score}); const fb=$('#feedback'); if(score===null){fb.innerHTML=`<div class="note">⏳ ${t('waitCheck')}</div>`} else if(score>0){fb.innerHTML=`<div class="note" style="background:#eefcf4;border-color:#cbf0d9;color:#2b7b4d">✅ ${t('correctMsg')} +${score}</div>`; confetti(); toast(t('confetti'))} else {fb.innerHTML=`<div class="note" style="background:#fff4f7;border-color:#ffd2dc;color:#a0485d">✖ ${t('wrongMsg')}</div>`} $('#submitBtn').classList.add('hidden'); $('#nextBtn').classList.remove('hidden')}
function nextQuestion(){state.currentIndex++; state.selected=null; if(state.currentIndex>=state.game.questions.length)go('reflect'); else go('play')}
function reflectView(){applyTheme(); app.innerHTML=header()+`<main class="main"><div class="section-head"><div><h3>💬 ${t('reflectionScene')}</h3><p>${state.studentName} ${state.avatar}</p></div></div><div class="layout"><div class="stack"><div class="panel"><div class="ref-grid"><div class="field"><label>${t('hard')}</label><select id="difficulty" class="input"><option>${t('hard1')}</option><option>${t('hard2')}</option><option>${t('hard3')}</option><option>${t('hard4')}</option><option>${t('hard5')}</option></select></div><div class="field"><label>${t('mood')}</label><select id="mood" class="input"><option>${t('mood1')}</option><option>${t('mood2')}</option><option>${t('mood3')}</option></select></div><div class="field"><label>${t('comment')}</label><textarea id="comment" class="input"></textarea></div><button class="btn success" onclick="finishQuest()">${t('send')}</button></div></div></div><aside class="stack"><div class="panel">${subjectScene(state.game.subject)}</div></aside></div></main>`}
function grade10(result){if(result.importedScore!==undefined)return Number(result.importedScore);const total=state.game.questions.reduce((s,q)=>s+Number(q.points),0); const earned=result.answers.reduce((s,a)=>s+(a.score||0),0); return total?Math.round((earned/total*10)*10)/10:0}
function finishQuest(){const result={id:Date.now()+Math.random().toString(36).slice(2),name:state.studentName,avatar:state.avatar,answers:state.answers,reflection:{difficulty:$('#difficulty').value,mood:$('#mood').value,comment:$('#comment').value.trim()},created:new Date().toISOString()}; state.game.results.push(result); saveGame(); go('done')}
function doneView(){applyTheme(); const r=state.game.results[state.game.results.length-1]; const score=grade10(r); const pending=r.answers.filter(a=>a.score===null).length; app.innerHTML=header()+`<main class="main"><div class="section-head"><div><h3>🏁 ${t('done')}</h3><p>${esc(r.name)} ${esc(r.avatar)}</p></div></div><div class="layout"><div class="stack"><div class="panel" style="text-align:center"><div style="font:800 78px Outfit,sans-serif;color:var(--accent3)">${score.toFixed(1)}<span style="font-size:26px;color:var(--muted)">/10</span></div><div class="tag">⚡ XP ${Math.round(score*120)}</div>${pending?`<p class="muted">${pending} · ${t('pending')}</p>`:''}<div class="cta" style="justify-content:center"><button class="btn" onclick="go('join')">👤 ${t('student')}</button><button class="btn secondary" onclick="go('results')">🏆 ${t('leaderboard')}</button></div></div></div><aside class="stack"><div class="panel">${subjectScene(state.game.subject)}</div></aside></div></main>`}
function resultsView(){applyTheme(); const list=[...state.game.results].sort((a,b)=>grade10(b)-grade10(a)); const pending=[]; state.game.results.forEach(r=>r.answers.forEach((a,idx)=>{if(a.score===null)pending.push({...a,rid:r.id,name:r.name,index:idx})})); app.innerHTML=header()+`<main class="main"><div class="section-head"><div><h3>🏆 ${t('report')}</h3><p>${state.game.results.length} ${t('leaderboard').toLowerCase()}</p></div><div class="row"><button class="ghost small" onclick="go('teacher')">${t('tabTeacher')}</button><button class="btn small" onclick="exportWorkbook()">📊 ${t('saveExcel')}</button><button class="ghost small" onclick="exportCSV()">⬇ CSV</button><button class="ghost small" onclick="clearResults()">🗑 ${t('clear')}</button></div></div><div class="tabs"><button onclick="go('teacher')">${t('tabTeacher')}</button><button onclick="go('join')">${t('tabStudent')}</button><button class="active">${t('tabResults')}</button></div><div class="layout"><div class="stack"><div class="panel"><h4>🏅 ${t('leaderboard')}</h4>${list.length?list.map((r,i)=>`<div class="leader"><div class="rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div><div class="who">${esc(r.avatar)} ${esc(r.name)}</div><div class="score">${grade10(r).toFixed(1)}/10</div></div>`).join(''):`<div class="empty">${t('noQuestions')}</div>`}</div><div class="panel"><h4>💬 ${t('reflection')}</h4>${state.game.results.length?state.game.results.map(r=>`<div class="reflect-card"><div class="row between"><span class="pill">${esc(r.reflection?.mood||'')}</span><span class="mini">${esc(r.name)}</span></div><strong>${esc(r.reflection?.difficulty||'')}</strong><p class="muted">${esc(r.reflection?.comment||'—')}</p></div>`).join(''):`<div class="empty">—</div>`}</div></div><aside class="stack"><div class="panel"><h4>✍️ ${t('gradeOpen')}</h4>${pending.length?pending.map(p=>`<div class="question-card"><div class="pill">${esc(p.name)}</div><h5>${esc(p.text)}</h5><p class="muted">${esc(p.answer)}</p><div class="row"><input id="g_${p.rid}_${p.index}" type="number" class="input" min="0" max="${p.points}" step="0.5" style="width:110px" placeholder="0-${p.points}"><button class="btn small" onclick="applyGrade('${p.rid}',${p.index},${p.points})">${t('approve')}</button></div></div>`).join(''):`<div class="empty">✓ ${state.lang==='ru'?'Нет непроверенных ответов':'Тексерілмеген жауап жоқ'}</div>`}<div class="note" style="margin-top:12px">${t('rights')}</div><div class="note" style="margin-top:12px">${t('excelHint')} ${t('syncNote')}</div></div><div class="panel">${subjectScene(state.game.subject)}</div></aside></div></main>`}
function applyGrade(id,idx,max){const el=$('#g_'+id+'_'+idx); const v=Number(el.value); if(el.value===''||v<0||v>max){toast('0-'+max); return} const r=state.game.results.find(x=>x.id===id); if(r){r.answers[idx].score=v; saveGame(); render()}}
function clearResults(){if(confirm('OK?')){state.game.results=[]; saveGame(); render()}}
const CSV_COLUMNS=['ID','Оқушы','Аватар','Пән','Ойын','Күні','Баға10','XP','Жетістіктер','Критерийлер','Жауаптар','Қиындық','Көңіл-күй','Рефлексия'];
function quoteCSV(v){let s=String(v??'');if(/^\s*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function exportCSV(){const rows=[CSV_COLUMNS,...state.game.results.map(r=>[r.id,r.name,r.avatar||'',state.game.subject,state.game.name,r.created||'',grade10(r),Math.round(grade10(r)*120),awards(r),(r.answers||[]).map(a=>`${a.criterion}: ${a.score??'—'}/${a.points}`).join(' | '),(r.answers||[]).map(a=>`${a.text}: ${a.answer}`).join(' | '),r.reflection?.difficulty||'',r.reflection?.mood||'',r.reflection?.comment||''])];const csv='\ufeff'+rows.map(r=>r.map(quoteCSV).join(';')).join('\r\n');const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));link.download='BILIM_QUEST_Жетістіктер.csv';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1500)}
function parseCSV(s){s=s.replace(/^\ufeff/,'');let out=[],row=[],value='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){value+='"';i++}else quoted=!quoted}else if(c===';'&&!quoted){row.push(value);value=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&s[i+1]==='\n')i++;row.push(value);if(row.some(x=>x!==''))out.push(row);row=[];value=''}else value+=c}if(quoted)throw Error('CSV: тырнақша қатесі');if(value||row.length){row.push(value);out.push(row)}return out}
async function importCSV(ev){const f=ev.target.files?.[0];if(!f)return;try{const rows=parseCSV(await f.text());if(rows[0]?.join(';')!==CSV_COLUMNS.join(';'))throw Error('BILIM QUEST CSV файлын таңдаңыз');let ids=new Set(state.game.results.map(r=>String(r.id))),added=0;for(let r of rows.slice(1)){if(r.length!==CSV_COLUMNS.length||!r[0]||ids.has(r[0]))continue;let [id,name,avatar,subj,game,date,score,xp,badges,criteria,answers,difficulty,mood,comment]=r;state.game.results.push({id,name,avatar,created:date,importedScore:Math.max(0,Math.min(10,Number(score)||0)),importedAwards:badges,answers:[],reflection:{difficulty,mood,comment}});ids.add(id);added++}saveGame();render();toast((state.lang==='kz'?'Жүктелді: ':'Загружено: ')+added)}catch(e){toast(e.message)}finally{ev.target.value=''}}
function selectSubject(k){state.subject=k; state.game.subject=k; saveGame(); render()}
function switchLang(){state.lang=state.lang==='ru'?'kz':'ru'; render()}
function loadDemo(){state.game=demoGame(); state.subject=state.game.subject; saveGame(); render()}
function go(v){syncBeforeLeave(); state.view=v; render()}
function syncBeforeLeave(){if($('#gameName')) syncGameMeta()}
let tempQuestionImage='';
function readQuestionImage(event){
 const file=event.target.files?.[0];if(!file)return;
 if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>1048576){toast(t('imageTooBig'));event.target.value='';return}
 const reader=new FileReader();reader.onload=()=>{tempQuestionImage=String(reader.result);showImagePreview()};reader.readAsDataURL(file)
}
function showImagePreview(){const area=$('#imagePreviewArea');if(!area)return;area.innerHTML=tempQuestionImage?`<div style="margin-top:10px"><img class="question-photo" src="${tempQuestionImage}" alt="${t('imagePreview')}"><button class="ghost small" onclick="removeQuestionImage()">🗑 ${t('imageRemove')}</button></div>`:`<small class="mini">${t('noImage')}</small>`}
function removeQuestionImage(){tempQuestionImage='';const field=$('#qImage');if(field)field.value='';showImagePreview()}
function xmlEsc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]))}
function colName(n){let s='';while(n){n--;s=String.fromCharCode(65+n%26)+s;n=Math.floor(n/26)}return s}
function worksheetXML(rows){let body=rows.map((row,r)=>`<row r="${r+1}">${row.map((v,c)=>{if(v===null||v===undefined||v==='')return '';const ref=colName(c+1)+(r+1);return typeof v==='number'&&Number.isFinite(v)?`<c r="${ref}"><v>${v}</v></c>`:`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`}).join('')}</row>`).join('');return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetData>${body}</sheetData></worksheet>`}
const encoder=new TextEncoder();
const crcTable=(()=>{let t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(buf){let c=-1;for(let i=0;i<buf.length;i++)c=(c>>>8)^crcTable[(c^buf[i])&255];return(c^-1)>>>0}
function u16(n){return [n&255,(n>>>8)&255]};function u32(n){return [n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]}
function packZip(entries){let parts=[],central=[],offset=0;for(const [name,content] of entries){const fname=encoder.encode(name),bytes=encoder.encode(content),crc=crc32(bytes),local=Uint8Array.from([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(bytes.length),...u32(bytes.length),...u16(fname.length),...u16(0)]);parts.push(local,fname,bytes);central.push(Uint8Array.from([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(bytes.length),...u32(bytes.length),...u16(fname.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset)]),fname);offset+=local.length+fname.length+bytes.length}const size=central.reduce((n,a)=>n+a.length,0);parts.push(...central,Uint8Array.from([...u32(0x06054b50),...u16(0),...u16(0),...u16(entries.length),...u16(entries.length),...u32(size),...u32(offset),...u16(0)]));return new Blob(parts,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
function buildSheets(){const g=state.game;
 const summary=[['№','Оқушы','Аватар','Пән','Сабақ тақырыбы','Ойын атауы','Баға / 10','Тексерілмеген жауаптар','Күні']];
 const answers=[['№','Оқушы','Деңгей','Тапсырма','Түрі','Критерий','Макс. ұпай','Жауап','Алынған ұпай','Тексеру мәртебесі']];
 const reflections=[['№','Оқушы','Қиындық','Сабақ әсері','Пікір','Күні']];
 const criteria=[['№','Критерий','Деңгей','Сұрақ түрі','Макс. ұпай','Тапсырма мәтіні']];
 const tasks=[['№','Пән','Деңгей','Тапсырма мәтіні','Түрі','Критерий','Макс. ұпай','Дұрыс жауап','Сурет бар ма?']];
 g.questions.forEach((q,i)=>{criteria.push([i+1,q.criterion||'',q.level,typeLabel(q.type),q.points,q.text]);tasks.push([i+1,subjectName(g.subject),q.level,q.text,typeLabel(q.type),q.criterion||'',q.points,q.answer||((q.pairs||[]).map(p=>p.join(' = ')).join('; ')),q.image?'Иә':'Жоқ'])});
 g.results.forEach((r,i)=>{summary.push([i+1,r.name,r.avatar,subjectName(g.subject),g.topic,g.name,grade10(r),r.answers.filter(a=>a.score===null).length,r.created]);reflections.push([i+1,r.name,r.reflection?.difficulty||'',r.reflection?.mood||'',r.reflection?.comment||'',r.created]);r.answers.forEach((a,j)=>answers.push([j+1,r.name,a.level,a.text,typeLabel(a.type),a.criterion,a.points,a.answer,a.score,a.score===null?'Тексерілмеген':'Тексерілген']))});
 return [['Нәтижелер',summary],['Жауаптар',answers],['Рефлексия',reflections],['Критерийлер',criteria],['Тапсырмалар',tasks]]}
function makeWorkbookBlob(){const sheets=buildSheets();const types='<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')+'</Types>';
 const workbook=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map(([name],i)=>`<sheet name="${xmlEsc(name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`;
 const rels=`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}</Relationships>`;
 let entries=[['[Content_Types].xml',types],['_rels/.rels','<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],['xl/workbook.xml',workbook],['xl/_rels/workbook.xml.rels',rels]];
 sheets.forEach(([name,rows],i)=>entries.push([`xl/worksheets/sheet${i+1}.xml`,worksheetXML(rows)]));return packZip(entries)}
async function exportWorkbook(){const blob=makeWorkbookBlob();const name='Таблица Результата_BILIM_QUEST.xlsx';try{if(window.showSaveFilePicker&&window.isSecureContext){const handle=await window.showSaveFilePicker({suggestedName:name,types:[{description:'Excel Workbook',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}]});const writable=await handle.createWritable();await writable.write(blob);await writable.close();toast('Excel ✓');return}}catch(err){if(err.name==='AbortError')return}const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Excel ✓')}
function render(){applyTheme(); if(state.view==='home') homeView(); if(state.view==='teacher') teacherView(); if(state.view==='join') joinView(); if(state.view==='play') playView(); if(state.view==='reflect') reflectView(); if(state.view==='done') doneView(); if(state.view==='results') resultsView();}
const app=document.getElementById('app'); render();
</script>
